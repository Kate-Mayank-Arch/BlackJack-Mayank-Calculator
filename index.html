<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Table Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F2F5F3;
    --surface: #FFFFFF;
    --ink: #12201A;
    --muted: #5A6A62;
    --line: #D6DFD9;
    --felt: #14513F;
    --felt-ink: #E8F4ED;
    --chip: #C23B33;
    --chip-ink: #FFFFFF;
    --win: #17744A;
    --loss: #B3322D;
    --soft: #F1F4F2;
    --warn-bg: #FFF4DB;
    --warn-ink: #6B4A00;
    --focus: #1F7A5C;
    --nav-h: 60px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B1410;
      --surface: #14211B;
      --ink: #E6F0EA;
      --muted: #94A79C;
      --line: #2A3C33;
      --felt: #10603F;
      --felt-ink: #E8F4ED;
      --chip: #D0463E;
      --win: #52C48C;
      --loss: #F27D75;
      --soft: #1B2A23;
      --warn-bg: #3A2E10;
      --warn-ink: #F3D58A;
      --focus: #52C48C;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B1410;
    --surface: #14211B;
    --ink: #E6F0EA;
    --muted: #94A79C;
    --line: #2A3C33;
    --felt: #10603F;
    --felt-ink: #E8F4ED;
    --chip: #D0463E;
    --win: #52C48C;
    --loss: #F27D75;
    --soft: #1B2A23;
    --warn-bg: #3A2E10;
    --warn-ink: #F3D58A;
    --focus: #52C48C;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.45;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 10px);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 12px; }
  h1, h2, h3 { font-family: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif; margin: 0; line-height: 1.2; }
  h2 { font-size: 17px; font-weight: 700; }
  h3 { font-size: 15px; font-weight: 700; }
  p { margin: 0; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* ---------- hero ---------- */
  .hero {
    background: linear-gradient(160deg, var(--felt), #0E4232);
    color: var(--felt-ink);
    margin: 10px -12px 0;
    padding: 14px 18px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    border-radius: 0 0 18px 18px;
  }
  .hero .title { font-weight: 700; font-size: 22px; letter-spacing: -0.01em; }
  .hero .sub { opacity: 0.85; font-size: 13px; margin-top: 3px; }
  .hero .carry { opacity: 0.8; font-size: 12px; margin-top: 2px; }
  .chip {
    flex: none;
    width: 88px; height: 88px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #D95048, var(--chip) 70%);
    color: var(--chip-ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border: 4px dashed rgba(255,255,255,0.9);
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
    text-align: center; padding: 4px;
  }
  .chip .lbl { font-size: 11px; font-weight: 600; opacity: 0.92; line-height: 1; letter-spacing: 0.06em; text-transform: uppercase; }
  .chip .val { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.1; margin-top: 3px; }
  .chip.sm .val { font-size: 15px; }
  .chip.xs .val { font-size: 12px; }

  /* ---------- bottom nav ---------- */
  .bottomnav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
    padding-bottom: env(safe-area-inset-bottom, 0px);
    display: flex; gap: 4px;
    background: var(--surface); border-top: 1px solid var(--line);
    box-shadow: 0 -4px 16px rgba(0,0,0,0.08);
  }
  .bottomnav button {
    flex: 1; border: 0; background: transparent; padding: 8px 4px 6px; border-radius: 10px;
    font-weight: 600; font-size: 12px; color: var(--muted); cursor: pointer; min-height: 44px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    touch-action: manipulation;
  }
  .bottomnav button svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .bottomnav button[aria-selected="true"] { color: var(--felt); }
  .bottomnav button[aria-selected="true"] svg { stroke-width: 2.4; }

  /* ---------- cards ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
  .card:first-of-type { margin-top: 10px; }
  .stack > * + * { margin-top: 10px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row.between { justify-content: space-between; }
  .row.wrap-r { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .divider { border: 0; border-top: 1px solid var(--line); margin: 12px 0; }
  .hint { color: var(--muted); font-size: 13px; }

  label.field { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  input[type="text"], select {
    width: 100%; min-height: 44px; padding: 8px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--soft);
  }
  input.small { width: 104px; text-align: right; flex: none; }

  .inline-field { display: flex; align-items: center; gap: 10px; justify-content: space-between; }

  .btn {
    min-height: 46px; padding: 8px 16px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--soft); font-weight: 600; cursor: pointer; touch-action: manipulation;
  }
  .btn.primary { background: var(--felt); border-color: var(--felt); color: var(--felt-ink); }
  .btn.danger { color: var(--loss); }
  .btn.ghost { border-color: transparent; background: transparent; color: var(--muted); text-decoration: underline; min-height: 38px; padding: 4px 8px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn.block { width: 100%; }

  /* who is playing */
  .pchips { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-top: 10px; }
  .pchip {
    border: 2px solid var(--line); background: var(--soft); border-radius: 14px;
    padding: 10px 12px; min-height: 52px; cursor: pointer; text-align: left; line-height: 1.25;
    touch-action: manipulation;
  }
  .pchip small { display: block; color: var(--muted); font-size: 11px; }
  .pchip[aria-pressed="true"] { border-color: var(--felt); background: var(--felt); color: var(--felt-ink); }
  .pchip[aria-pressed="true"] small { color: var(--felt-ink); opacity: 0.8; }
  .pmark { float: right; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); line-height: 16px; text-align: center; font-size: 11px; }
  .pchip[aria-pressed="true"] .pmark { border-color: var(--felt-ink); background: var(--felt-ink); color: var(--felt); }

  /* rounds */
  .round { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--soft); margin-top: 10px; }
  .round > h3 + .hint { margin-top: 2px; }
  .raiser-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; margin-top: 10px; }

  .pcard {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--line); background: var(--surface);
    border-radius: 12px; padding: 8px 10px; margin-top: 8px;
    flex-wrap: wrap;
  }
  .pcard .pname { flex: 1 1 90px; min-width: 0; font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .status { font-size: 11px; padding: 3px 8px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--muted); flex: none; }
  .pcard.folded { opacity: 0.6; }
  .pcard.folded .pname { text-decoration: line-through; }
  .bets { display: flex; align-items: center; gap: 8px; flex: 1 1 190px; justify-content: flex-end; }
  .bets input { width: 84px; text-align: right; padding: 6px 8px; min-height: 40px; border-radius: 9px; flex: none; }
  .bets .paidlbl { flex: none; text-align: left; font-size: 11px; color: var(--muted); line-height: 1.3; }
  .fold-btn {
    flex: none; width: 66px; min-height: 40px; border-radius: 9px;
    border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px;
    color: var(--muted); cursor: pointer; touch-action: manipulation;
  }
  .fold-btn.call.on { background: var(--felt); border-color: var(--felt); color: var(--felt-ink); }
  .fold-btn.fold.on { background: var(--chip); border-color: var(--chip); color: #fff; }

  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--soft); color: var(--muted); border: 1px solid var(--line); vertical-align: middle; }
  .badge.bust { background: var(--chip); color: var(--chip-ink); border-color: var(--chip); }
  .badge.win { background: var(--win); color: #fff; border-color: var(--win); }
  .badge.open { color: var(--chip); border-color: var(--chip); background: transparent; }
  .badge.raisertag { color: var(--chip); border-color: var(--chip); background: transparent; }

  .notice { padding: 10px 12px; border-radius: 10px; background: var(--soft); border: 1px solid var(--line); font-size: 14px; }
  .notice.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: transparent; }
  .notice.good { border-color: var(--win); }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
  .stat { background: var(--soft); border-radius: 10px; padding: 8px 10px; }
  .stat .k { font-size: 11px; color: var(--muted); }
  .stat .v { font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }

  .scroll-x { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: right; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px; }
  td { text-align: right; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  th:first-child, td:first-child { text-align: left; padding-left: 0; }
  td:last-child, th:last-child { padding-right: 0; }
  td .sub { display: block; font-size: 11px; color: var(--muted); }
  .pos { color: var(--win); font-weight: 600; }
  .neg { color: var(--loss); font-weight: 600; }
  .zero { color: var(--muted); }
  tr.winner td:first-child { font-weight: 700; }

  .loan { border-top: 1px solid var(--line); padding: 10px 0; font-size: 13px; }
  .loan:first-child { border-top: 0; }
  details summary { cursor: pointer; font-weight: 600; min-height: 36px; display: flex; align-items: center; }
  details ul { margin: 6px 0 0; padding-left: 20px; color: var(--muted); font-size: 13px; }
  details li + li { margin-top: 4px; }

  .empty { text-align: center; padding: 22px 8px; color: var(--muted); }
  .empty .btn { margin-top: 10px; }

  #toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 12px);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 14px; max-width: 90%; z-index: 20; opacity: 0; pointer-events: none;
    transition: opacity 0.18s;
  }
  #toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
  input[type="text"] { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<div class="wrap"><div id="app"></div></div>
<nav class="bottomnav" id="nav" role="tablist"></nav>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ---------- helpers ---------- */
  var STORE_KEY = 'table-ledger-v2';
  var uid = function () { return Math.random().toString(36).slice(2, 9); };
  var r2 = function (n) { return Math.round((n + Number.EPSILON) * 100) / 100; };
  var fmt = function (n) { return r2(n).toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
  var sgn = function (n) { n = r2(n); return (n > 0 ? '+' : n < 0 ? '\u2212' : '') + fmt(Math.abs(n)); };
  var cls = function (n) { n = r2(n); return n > 0 ? 'pos' : n < 0 ? 'neg' : 'zero'; };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  };
  var num = function (v) { var n = parseFloat(String(v).replace(/,/g, '')); return isFinite(n) ? n : 0; };
  var money = function (v) { return Math.max(0, num(v)); };

  /* ---------- state ---------- */
  // Round 1 ("bet"):  each player types their own bet or folds.
  // Raise rounds:     one player is the raiser, everyone else must add >= r.raise or fold.
  function newRound() { return { type: 'bet', raise: 10, raiserId: null, status: {}, amount: {} }; }
  function newDraft(entrants) { return { entrants: entrants || [], rounds: [newRound()], hands: {} }; }
  function defaultState() {
    return {
      settings: { entryFee: 10, firstBet: 10, rate: 5, type: 'simple', start: 100 },
      players: [], gameNo: 1, carry: 0, history: [],
      draft: newDraft([]), tab: 'table', undo: null
    };
  }
  var state = load() || defaultState();
  state.players.forEach(function (p) { p.loans = p.loans || []; });
  var ui = { newName: '', loanAmt: {}, repayAmt: {}, confirm: '' };

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return null;
      var s = JSON.parse(raw);
      if (s && s.settings && s.players) {
        (s.draft.rounds || []).forEach(function (r) {
          r.amount = r.amount || {}; r.status = r.status || {};
          r.raise = money(r.raise) || 10; r.raiserId = r.raiserId || null; r.type = r.type || 'bet';
        });
        return s;
      }
      return null;
    } catch (e) { return null; }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage may be unavailable */ }
  }

  var toastTimer;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  /* ---------- game maths ---------- */
  function playerById(id) { return state.players.filter(function (p) { return p.id === id; })[0]; }
  function debtOf(p) {
    return r2(p.loans.reduce(function (a, l) { return a + l.principal + l.interest; }, 0));
  }

  function compute() {
    var d = state.draft, fee = money(state.settings.entryFee);
    var ents = d.entrants.filter(function (id) { return !!playerById(id); });
    var paid = {}, out = {};
    ents.forEach(function (id) { paid[id] = fee; });
    var pot = state.carry + fee * ents.length;
    var rounds = [];

    d.rounds.forEach(function (r) {
      var active = ents.filter(function (id) { return !out[id]; });
      var stay = [];
      if (r.type === 'bet') {
        // round 1: everyone still in pays their own typed amount (default firstBet if blank) or folds
        active.forEach(function (id) {
          if ((r.status[id] || 'bet') === 'fold') { out[id] = true; }
          else {
            var raw = r.amount[id];
            var amt = (raw === undefined || raw === '' ) ? money(state.settings.firstBet) : money(raw);
            paid[id] += amt; pot += amt; stay.push(id);
          }
        });
        rounds.push({ type: 'bet', active: stay.slice() });
      } else {
        var raise = money(r.raise);
        // raiser must be someone still in; fall back to the first active player so the UI and maths agree
        var rid = (r.raiserId && active.indexOf(r.raiserId) >= 0) ? r.raiserId : (active[0] || null);
        if (rid && raise > 0) {
          active.forEach(function (id) {
            if (id === rid) { paid[id] += raise; pot += raise; stay.push(id); return; }
            if ((r.status[id] || 'call') === 'fold') { out[id] = true; return; }
            // blank amount = auto-call the raise; a typed amount must cover it
            var raw = r.amount[id];
            var amt = (raw === undefined || raw === '') ? raise : money(raw);
            paid[id] += amt; pot += amt; stay.push(id);
          });
        }
        rounds.push({ type: 'raise', raise: raise, raiserId: rid, active: stay.slice() });
      }
    });

    var active = ents.filter(function (id) { return !out[id]; });
    var vals = {};
    active.forEach(function (id) {
      var h = d.hands[id];
      vals[id] = (h === undefined || h === '' || !isFinite(parseFloat(h))) ? null : parseFloat(h);
    });

    var status = 'incomplete', winners = [], byDefault = false;
    if (ents.length < 2) status = 'need-players';
    else if (active.length === 0) status = 'no-winner';
    else if (active.length === 1) { status = 'ok'; winners = [active[0]]; byDefault = true; }
    else if (active.some(function (id) { return vals[id] === null; })) status = 'incomplete';
    else {
      var valid = active.filter(function (id) { return vals[id] <= 21; });
      if (!valid.length) status = 'no-winner';
      else {
        var max = Math.max.apply(null, valid.map(function (id) { return vals[id]; }));
        winners = valid.filter(function (id) { return vals[id] === max; });
        status = 'ok';
      }
    }

    var cents = Math.round(pot * 100), payout = {}, share = 0, carryOut = 0;
    if (winners.length) {
      var shareC = Math.floor(cents / winners.length);
      share = shareC / 100;
      carryOut = (cents - shareC * winners.length) / 100;
      winners.forEach(function (id) { payout[id] = share; });
    } else if (status === 'no-winner') {
      carryOut = r2(pot);
    }
    var net = {};
    ents.forEach(function (id) { net[id] = r2((payout[id] || 0) - paid[id]); });
    return { ents: ents, paid: paid, out: out, rounds: rounds, active: active, vals: vals,
             status: status, winners: winners, byDefault: byDefault,
             pot: r2(pot), share: share, payout: payout, net: net, carryOut: r2(carryOut) };
  }

  // what a player has put in before the given round (for the little "already in" label)
  function paidSoFarBefore(c, id, roundIdx) {
    var sum = money(state.settings.entryFee), out = false;
    for (var j = 0; j < state.draft.rounds.length && j < roundIdx; j++) {
      var r = state.draft.rounds[j];
      if (out) break;
      if (r.type === 'bet') {
        if ((r.status[id] || 'bet') === 'fold') { out = true; break; }
        var raw = r.amount[id];
        sum += (raw === undefined || raw === '') ? money(state.settings.firstBet) : money(raw);
      } else {
        if (id === r.raiserId) { sum += money(r.raise); continue; }
        if ((r.status[id] || 'call') === 'fold') { out = true; break; }
        sum += money(r.amount[id]);
      }
    }
    return sum;
  }

  function accrue() {
    var total = 0;
    state.players.forEach(function (p) {
      p.loans.forEach(function (l) {
        if (l.principal + l.interest <= 0.004) return;
        var base = l.type === 'compound' ? l.principal + l.interest : l.principal;
        var i = r2(base * l.rate / 100);
        l.interest = r2(l.interest + i);
        l.interestCharged = r2(l.interestCharged + i);
        total += i;
      });
    });
    return r2(total);
  }

  function settle() {
    var c = compute();
    if (c.status !== 'ok' && c.status !== 'no-winner') return;
    state.undo = JSON.stringify(Object.assign({}, state, { undo: null }));
    var rows = c.ents.map(function (id) {
      var p = playerById(id), v = c.vals[id];
      var hand = c.out[id] ? 'out' : (c.byDefault ? 'default' : (v > 21 ? 'bust' : v));
      p.balance = r2(p.balance + c.net[id]);
      return { name: p.name, paid: c.paid[id], hand: hand, payout: c.payout[id] || 0, net: c.net[id] };
    });
    var names = c.winners.map(function (id) { return playerById(id).name; });
    var summary = c.winners.length > 1
      ? names.join(' and ') + ' tied and split ' + fmt(c.pot)
      : c.winners.length === 1 ? names[0] + ' won ' + fmt(c.pot)
      : 'No winner, ' + fmt(c.pot) + ' carried over';
    var carryIn = state.carry;
    state.carry = c.carryOut;
    var interest = accrue();
    state.history.unshift({ game: state.gameNo, pot: c.pot, summary: summary, rows: rows,
                            carryIn: carryIn, carryOut: c.carryOut, interest: interest });
    state.gameNo += 1;
    state.draft = newDraft(state.draft.entrants.slice());
    toast('Game settled. Balances updated.');
  }

  function takeLoan(p, amt) {
    p.balance = r2(p.balance + amt);
    p.loans.push({ id: uid(), amount: amt, principal: amt, interest: 0, interestCharged: 0, repaid: 0,
                   rate: money(state.settings.rate), type: state.settings.type, gameTaken: state.gameNo });
  }
  function repayLoans(p, amt) {
    var left = amt;
    p.loans.forEach(function (l) {
      if (left <= 0) return;
      var pi = Math.min(left, l.interest);
      l.interest = r2(l.interest - pi); left = r2(left - pi); l.repaid = r2(l.repaid + pi);
      var pp = Math.min(left, l.principal);
      l.principal = r2(l.principal - pp); left = r2(left - pp); l.repaid = r2(l.repaid + pp);
    });
    p.balance = r2(p.balance - amt);
  }

  /* ---------- actions ---------- */
  var actions = {
    tab: function (d) { state.tab = d.v; },
    toggleEntrant: function (d) {
      var e = state.draft.entrants, i = e.indexOf(d.id);
      if (i >= 0) {
        e.splice(i, 1);
        state.draft.rounds.forEach(function (r) {
          delete r.status[d.id]; delete r.amount[d.id];
          if (r.raiserId === d.id) r.raiserId = null;
        });
        delete state.draft.hands[d.id];
      } else { e.push(d.id); }
    },
    setStatus: function (d) {
      var r = state.draft.rounds[+d.r], cur = r.status[d.id] || '';
      if (d.v === '') { delete r.status[d.id]; }
      else if (d.v === cur) { delete r.status[d.id]; } // tap again to toggle off
      else { r.status[d.id] = d.v; }
    },
    setRaiser: function (d) { state.draft.rounds[+d.r].raiserId = d.id; },
    addRound: function () {
      var d = state.draft;
      var last = d.rounds[d.rounds.length - 1];
      var base = last.type === 'bet'
        ? Math.max.apply(null, d.entrants.map(function (id) {
            var raw = last.amount[id];
            return (raw === undefined || raw === '') ? money(state.settings.firstBet) : money(raw);
          }).concat([money(state.settings.firstBet)]))
        : money(last.raise);
      var nr = { type: 'raise', raise: base, raiserId: null, status: {}, amount: {} };
      var stillIn = d.entrants.filter(function (id) {
        // someone is still in if they never folded in a prior round
        return !d.rounds.some(function (rr, i) {
          if (rr.type === 'bet') return (rr.status[id] || 'bet') === 'fold';
          return rr.raiserId && rr.raiserId !== id && (rr.status[id] || 'call') === 'fold';
        });
      });
      nr.raiserId = stillIn.length ? stillIn[0] : null;
      d.rounds.push(nr);
    },
    removeRound: function () { if (state.draft.rounds.length > 1) state.draft.rounds.pop(); },
    clearDraft: function () { state.draft = newDraft(state.draft.entrants.slice()); },
    settle: function () { settle(); },
    undo: function () {
      if (!state.undo) return;
      var tab = state.tab, prev = JSON.parse(state.undo);
      state = prev; state.tab = tab; state.undo = null;
      toast('Last settled game undone.');
    },
    addPlayer: function () {
      var name = ui.newName.trim();
      if (!name) { toast('Type a player name first.'); return 'skip'; }
      var p = { id: uid(), name: name, balance: money(state.settings.start), loans: [] };
      state.players.push(p);
      state.draft.entrants.push(p.id);
      ui.newName = '';
    },
    removePlayer: function (d) {
      var p = playerById(d.id), key = 'rm:' + d.id;
      if (debtOf(p) > 0) { toast('Clear ' + p.name + "'s loans before removing."); return 'skip'; }
      if (ui.confirm !== key) { ui.confirm = key; return; }
      state.players = state.players.filter(function (x) { return x.id !== d.id; });
      state.draft.entrants = state.draft.entrants.filter(function (x) { return x !== d.id; });
      ui.confirm = '';
    },
    takeLoan: function (d) {
      var p = playerById(d.id), amt = money(ui.loanAmt[d.id]);
      if (amt <= 0) { toast('Enter a loan amount above 0.'); return 'skip'; }
      takeLoan(p, amt); ui.loanAmt[d.id] = '';
      toast(p.name + ' borrowed ' + fmt(amt) + '.');
    },
    repay: function (d) {
      var p = playerById(d.id), amt = money(ui.repayAmt[d.id]), debt = debtOf(p);
      if (amt <= 0) { toast('Enter a repayment amount above 0.'); return 'skip'; }
      if (amt > debt) { toast('That is more than the ' + fmt(debt) + ' owed.'); return 'skip'; }
      if (amt > p.balance) { toast('Balance is only ' + fmt(p.balance) + '.'); return 'skip'; }
      repayLoans(p, amt); ui.repayAmt[d.id] = '';
      toast(p.name + ' repaid ' + fmt(amt) + '.');
    },
    resetAll: function () {
      if (ui.confirm !== 'reset') { ui.confirm = 'reset'; return; }
      state = defaultState(); ui.confirm = '';
      toast('Everything reset.');
    }
  };

  /* ---------- rendering ---------- */
  function chipSize(s) { return s.length > 9 ? 'xs' : s.length > 6 ? 'sm' : ''; }

  function viewHero(c) {
    var p = fmt(c.pot);
    return '<header class="hero">' +
      '<div><h1 class="title">Game ' + state.gameNo + '</h1>' +

      (state.carry > 0 ? '<p class="carry">Includes ' + fmt(state.carry) + ' carried over</p>' : '') +
      '</div>' +
      '<div class="chip ' + chipSize(p) + '" aria-label="Pot ' + p + '"><span class="lbl">Pot</span><span class="val num">' + p + '</span></div>' +

  var NAV = [
    ['table', 'Table', '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="5.5"/><circle cx="12" cy="12" r="1.6"/></svg>'],

    ['history', 'History', '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>']
  ];
  function viewNav() {

    }).join('');
  }

  function statusOf(r, id, fallback) { return r.status[id] || fallback; }

  function viewTable(c) {
    var d = state.draft;
    var h = '';
    if (!state.players.length) {
      return '<div class="card empty"><h2>No players yet</h2><p class="hint">Add the people playing, then come back to set up a game.</p>' +

        return '<button class="pchip" aria-pressed="' + on + '" data-act="toggleEntrant" data-id="' + p.id + '">' +

    var r0 = d.rounds[0], c0 = c.rounds[0];

    if (!c0 || !c0.active.length) h += '<p class="hint" style="margin-top:8px">Nobody has bet yet.</p>';
    d.entrants.forEach(function (id) {

      var st = statusOf(r0, id, ''), folded = st === 'fold';
        var lastPaid = paidSoFarBefore(c, id, 0);

      if (folded) {
        h += '<span class="status">Folded &middot; loses ' + fmt(lastPaid) + '</span>' +

      } else {
        h += '<div class="bets"><span class="paidlbl num">already in<br>' + fmt(lastPaid) + '</span>' +
          '<input class="num" type="text" inputmode="decimal" aria-label="' + esc(playerById(id).name) + ' first bet, leave blank for ' + fmt(money(state.settings.firstBet)) + '" ' +
          'placeholder="' + fmt(money(state.settings.firstBet)) + '" data-fk="bet:' + id + '" data-bind="bet:' + id + '" value="' + esc(r0.amount[id] === undefined ? '' : r0.amount[id]) + '">' +
          '<button class="fold-btn call' + (st !== 'fold' ? ' on' : '') + '" aria-pressed="' + (st !== 'fold') + '" data-act="setStatus" data-r="0" data-id="' + id + '" data-v="bet">Bet</button>' +
          '<button class="fold-btn fold" aria-pressed="false" data-act="setStatus" data-r="0" data-id="' + id + '" data-v="fold">Fold</button></div>';
      }
      h += '</div>';
    });
    h += '<p class="hint" style="margin-top:8px">Leave the amount blank for the default first bet of <strong class="num">' + fmt(money(state.settings.firstBet)) + '</strong> (change it in Players).</p>';
    h += '</div>';

    /* Raise rounds */
    for (var i = 1; i < d.rounds.length; i++) {
      var r = d.rounds[i], cr = c.rounds[i] || { active: [] };
      var stillIn = i ? (c.rounds[i - 1] ? c.rounds[i - 1].active : c.ents) : c.ents;
      var raiserName = r.raiserId && playerById(r.raiserId) ? playerById(r.raiserId).name : '\u2013';
      h += '<div class="round"><h3>Round ' + (i + 1) + ' &middot; extra card</h3>' +
        '<p class="hint">The raiser sets the raise and pays it. Everyone else must add at least that much to stay in, or fold.</p>' +
        '<div class="raiser-row"><div class="grow"><label class="field" for="rais_' + i + '">Raiser (bets first)</label>' +
        '<select id="rais_' + i + '" data-fk="rais_' + i + '" data-bind="raiser:' + i + '">';
      var pool = stillIn.length ? stillIn : d.entrants;
      var chosen = pool.indexOf(r.raiserId) >= 0 ? r.raiserId : (pool.length ? pool[0] : '');
      pool.forEach(function (id) {
        h += '<option value="' + id + '"' + (id === chosen ? ' selected' : '') + '>' + esc(playerById(id).name) + '</option>';

      if (!pool.length) h += '<option value="">\u2013 no one is in \u2013</option>';
      h += '</select></div>' +
        '<div><label class="field" for="raise_' + i + '">Raise</label>' +
        '<input class="num small" id="raise_' + i + '" type="text" inputmode="decimal" data-fk="raise:' + i + '" data-bind="raise:' + i + '" value="' + esc(r.raise) + '" style="width:96px"></div></div>';

      // previous called amount for the escalating hint
      var prev = d.rounds[i - 1];
      var prevAmt = prev.type === 'bet'
        ? Math.max.apply(null, d.entrants.map(function (id) {
            var raw = prev.amount[id];
            return (raw === undefined || raw === '') ? money(state.settings.firstBet) : money(raw);
          }).concat([money(state.settings.firstBet)]))
        : money(prev.raise);
      var okRaise = money(r.raise) >= prevAmt;
      h += '<p class="hint num" style="margin-top:6px">Previous round\u2019s highest bet: ' + fmt(prevAmt) +
        '. This raise is ' + (okRaise ? 'at least that. Good.' : '<strong>below it — the raise should be higher.</strong>') + '</p>';

      if (!cr.active.length) {
        h += '<p class="hint" style="margin-top:8px">No one is still in for this round. Remove the last round or start a new game.</p>';
      }
      stillIn.forEach(function (id) {
        var isR = id === chosen;
        if (isR) {
          h += '<div class="pcard"><span class="pname">' + esc(playerById(id).name) +
            ' <span class="badge raisertag">Raiser</span></span>' +
            '<span class="status num">pays ' + fmt(money(r.raise)) + '</span></div>';
          return;
        }
        var st = statusOf(r, id, ''), folded = st === 'fold';
        var basePaid = paidSoFarBefore(c, id, i);
        h += '<div class="pcard' + (folded ? ' folded' : '') + '"><span class="pname">' + esc(playerById(id).name) + '</span>';
        if (folded) {
          h += '<span class="status">Folded &middot; loses ' + fmt(r2(basePaid)) + '</span>' +
            '<button class="fold-btn call" data-act="setStatus" data-r="' + i + '" data-id="' + id + '" data-v="fold">Undo</button>';
        } else {
          h += '<div class="bets"><span class="paidlbl num">already in<br>' + fmt(basePaid) + '</span>' +
            '<input class="num" type="text" inputmode="decimal" aria-label="' + esc(playerById(id).name) + ' added amount, at least ' + fmt(money(r.raise)) + '" ' +
            'placeholder="&ge; ' + fmt(money(r.raise)) + '" data-fk="amt:' + i + ':' + id + '" data-bind="amount:' + i + ':' + id + '" value="' + esc(r.amount[id] || '') + '">' +
            '<button class="fold-btn fold" aria-pressed="false" data-act="setStatus" data-r="' + i + '" data-id="' + id + '" data-v="fold">Fold</button></div>';
        }
        h += '</div>';
      });

    }

    var canAdd = c.active.length > 1;

      h += '<p class="hint">Everyone is out. Nothing to enter.</p>';
    } else if (c.active.length === 1) {
      h += '<p class="hint">Only ' + esc(playerById(c.active[0]).name) + ' is still in, so they win the pot without showing a hand.</p>';

    else {

      msg = c.winners.length > 1

      '<li>Every player pays the same entry fee into the pot.</li>' +
      '<li>After seeing 2 cards, each player bets their own amount or folds. Folding gives up everything paid so far.</li>' +
      '<li>In an extra round the first player (the raiser) sets the raise; every other player adds at least that much or folds, and the raise should be higher than the previous raise.</li>' +

      '<li>If one player is left, they win. If everyone is out or bust, the pot carries to the next game.</li>' +
      '<li>Net is what a player gets back minus everything they paid in.</li></ul></details></section>';
    return h;
  }

        '<button class="btn" data-act="takeLoan" data-id="' + p.id + '" style="min-width:104px;flex:none">Take loan</button></div>' +
        '<div class="row" style="margin-top:8px"><div class="grow"><input type="text" inputmode="decimal" aria-label="Repayment for ' + esc(p.name) + '" placeholder="Repay amount" data-fk="repay:' + p.id + '" data-bind="repay:' + p.id + '" value="' + esc(ui.repayAmt[p.id] || '') + '"></div>' +
        '<button class="btn" data-act="repay" data-id="' + p.id + '" style="min-width:104px;flex:none">Repay</button></div>' +
        '<p class="hint" style="margin-top:6px">Repayments clear interest first, then the oldest loan.</p>';
      if (p.loans.length) {
        h += '<hr class="divider"><h3>Loans taken</h3>' + p.loans.slice().reverse().map(viewLoan).join('');
      }
      h += '</section>';
    });

    h += '<div style="margin-top:16px"><button class="btn danger block" data-act="resetAll">' +
      (ui.confirm === 'reset' ? 'Tap again to erase all players, loans and history' : 'Reset everything') + '</button></div>';
    return h;
  }

  function viewHistory() {
    var h = '';
    if (!state.history.length) {
      h += '<div class="card empty"><h2>No games settled yet</h2><p class="hint">Finished games and who won what show up here.</p></div>';
    }
    state.history.forEach(function (g) {
      h += '<section class="card"><div class="row between"><h2>Game ' + g.game + '</h2><span class="hint num">Pot ' + fmt(g.pot) + '</span></div>' +
        '<p style="margin-top:4px">' + esc(g.summary) + '.</p>' +
        '<div class="scroll-x"><table style="margin-top:8px"><thead><tr><th>Player</th><th>Paid in</th><th>Hand</th><th>Net</th></tr></thead><tbody>' +
        g.rows.map(function (r) {
          var hand = r.hand === 'out' ? 'Out' : r.hand === 'bust' ? 'Bust' : r.hand === 'default' ? 'Last in' : r.hand;
          return '<tr><td>' + esc(r.name) + '</td><td class="num">' + fmt(r.paid) + '</td><td class="num">' + hand + '</td><td class="num ' + cls(r.net) + '">' + sgn(r.net) + '</td></tr>';
        }).join('') + '</tbody></table></div>' +
        (g.carryIn > 0 ? '<p class="hint" style="margin-top:6px">Started with ' + fmt(g.carryIn) + ' carried over.</p>' : '') +
        (g.interest > 0 ? '<p class="hint" style="margin-top:6px">Loan interest added after this game: ' + fmt(g.interest) + '.</p>' : '') +
        '</section>';
    });
    return h;
  }

  /* ---------- render ---------- */
  var app = document.getElementById('app');
  var nav = document.getElementById('nav');
  function render() {
    var c = compute();
    var ae = document.activeElement, fk = ae && ae.dataset ? ae.dataset.fk : null, pos = null;
    try { pos = ae.selectionStart; } catch (e) { pos = null; }
    var body = state.tab === 'players' ? viewPlayers() : state.tab === 'history' ? viewHistory() : viewTable(c);
    app.innerHTML = viewHero(c) + body;
    nav.innerHTML = viewNav();
    if (fk) {
      var el = app.querySelector('[data-fk="' + fk + '"]');
      if (el && el !== ae) {
        el.focus({ preventScroll: true });
        try { if (pos !== null) el.setSelectionRange(pos, pos); } catch (e) { /* not supported */ }
      }
    }
  }
  function commit() { save(); render(); }

  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.disabled) return;
    var fn = actions[t.dataset.act];
    if (!fn) return;
    var keepConfirm = t.dataset.act === 'removePlayer' || t.dataset.act === 'resetAll';
    var res = fn(t.dataset);
    if (!keepConfirm) ui.confirm = '';
    if (res === 'skip') { render(); return; }
    commit();
  });

  app.addEventListener('input', function (e) {
    var t = e.target, b = t.dataset ? t.dataset.bind : null;
    if (!b) return;
    var parts = b.split(':'), k = parts[0], id = parts[1];
    if (k === 'newName') { ui.newName = t.value; save(); return; }
    if (k === 'loan') { ui.loanAmt[id] = t.value; save(); return; }
    if (k === 'repay') { ui.repayAmt[id] = t.value; save(); return; }
    if (k === 'fee') state.settings.entryFee = t.value;
    else if (k === 'start') state.settings.start = t.value;
    else if (k === 'firstBet') state.settings.firstBet = t.value;
    else if (k === 'rate') state.settings.rate = t.value;
    else if (k === 'type') state.settings.type = t.value;
    else if (k === 'raiser') state.draft.rounds[+id].raiserId = t.value;
    else if (k === 'bet') state.draft.rounds[0].amount[id] = t.value;
    else if (k === 'hand') state.draft.hands[id] = t.value;
    else if (k === 'raise') state.draft.rounds[+id].raise = t.value;
    else if (k === 'amount') {
      // bind is amount:<roundIndex>:<playerId>
      state.draft.rounds[+id].amount[parts[2]] = t.value;
    }
    save();
    render();
  });

  nav.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t) return;
    actions.tab(t.dataset);
    save(); render();
  });

  app.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    var t = e.target;
    if (t.id === 'newName') { actions.addPlayer({}); ui.confirm = ''; commit(); }
  });

  render();
})();
</script>
</body>
</html>
